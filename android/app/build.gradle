plugins { id 'com.android.application' }

android { namespace 'com.axilort.engine'; compileSdk 35
    defaultConfig { applicationId 'com.axilort.engine'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
}

tasks.register('copyWebApp', Copy) {
    from(rootProject.projectDir.parentFile) {
        exclude 'android/**', '.git/**', '.github/**'
    }
    into(layout.buildDirectory.dir('generated/webapp'))
}

tasks.register('copyAxilortLogo', Copy) {
    from(rootProject.projectDir.parentFile.toPath().resolve('images/logo.png'))
    into(layout.buildDirectory.dir('generated/res/drawable'))
    rename { 'axilort_real_logo.png' }
}

preBuild.dependsOn(copyWebApp, copyAxilortLogo)

android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/webapp'))
android.sourceSets.main.res.srcDir(layout.buildDirectory.dir('generated/res'))
