<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="description" content="Axilort Engine projects.">
<title>Projects — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}
.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}
@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}
.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}
.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain;flex:none}
.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap;text-decoration:none}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#fff;filter:drop-shadow(0 0 4px #ffffff33)}
.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:clamp(8px,1.5vw,15px);margin-bottom:clamp(8px,1.15vw,17px)}.heading h1{margin:0;font-size:clamp(15px,2.55vw,27px);font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:var(--muted);font-size:clamp(7px,1.05vw,13px);line-height:1.35}.heading p b{color:#bdbdc1}.primary{border:1px solid #ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);box-shadow:0 6px 18px rgba(255,32,40,.16);border-radius:7px;padding:clamp(6px,1vw,11px) clamp(9px,1.5vw,17px);font-size:clamp(7px,1vw,12px);font-weight:750;transition:.18s;white-space:nowrap}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.project-list{display:flex;flex-direction:column;gap:clamp(6px,1vw,11px)}.project-bar{position:relative;min-height:clamp(48px,6vw,68px);display:flex;align-items:center;gap:clamp(8px,1.2vw,15px);padding:clamp(7px,1.15vw,12px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,15px);background:linear-gradient(145deg,#0c0c0d,#080809)}.project-bar:hover{border-color:#8e161b}.project-icon{width:clamp(29px,3.5vw,43px);height:clamp(29px,3.5vw,43px);display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:clamp(7px,1vw,10px);color:var(--red);flex:none;font-size:clamp(11px,1.35vw,17px)}.project-info{min-width:0;flex:1}.project-info strong{display:block;font-size:clamp(9px,1.15vw,14px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-info small{display:block;margin-top:3px;color:#777;font-size:clamp(7px,.9vw,11px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:clamp(28px,3.2vw,38px);height:clamp(28px,3.2vw,38px);border:1px solid transparent;border-radius:8px;background:transparent;font-size:clamp(17px,2vw,22px);color:#fff}.more:hover,.more.open{background:#111112;border-color:#29292b}.menu{position:absolute;right:clamp(7px,1vw,10px);top:calc(100% + 5px);z-index:20;min-width:clamp(130px,14vw,165px);padding:4px;border:1px solid var(--border);border-radius:9px;background:#0b0b0c;box-shadow:0 18px 50px #000d;display:none}.menu.show{display:block}.menu button{width:100%;height:clamp(30px,3vw,35px);border:0;border-radius:6px;background:transparent;text-align:left;padding:0 10px;font-size:clamp(8px,.95vw,11px)}.menu button:hover{background:#151516}.menu .danger{color:#ff5960}
.empty{min-height:clamp(80px,9vw,115px);border:1px dashed #29292b;border-radius:clamp(9px,1.2vw,15px);display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center;padding:10px}.empty-icon{width:clamp(28px,3.2vw,40px);height:clamp(28px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px;font-size:clamp(9px,1.3vw,15px)}.empty strong{font-size:clamp(8px,1.05vw,12px)}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}
.backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}.backdrop.show{display:flex}.modal{width:min(430px,92vw);border:1px solid #29292d;border-radius:16px;background:linear-gradient(145deg,#101011,#080809);box-shadow:0 30px 100px #000;overflow:hidden;animation:modalIn .18s ease-out}@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}.modal-head{padding:clamp(14px,1.8vw,20px);border-bottom:1px solid var(--border2)}.modal-title{display:flex;align-items:center;gap:10px}.modal-symbol{width:34px;height:34px;border:1px solid #652025;border-radius:9px;display:grid;place-items:center;color:var(--red);background:#18090a;font-size:15px}.modal-head h2{margin:0;font-size:clamp(13px,1.6vw,18px);font-weight:800}.modal-head p{margin:5px 0 0 44px;color:#777;font-size:clamp(8px,1vw,11px);line-height:1.4}.modal-body{padding:clamp(14px,1.8vw,20px)}.field label{display:block;color:#aaa;font-size:clamp(8px,.9vw,10px);font-weight:750;letter-spacing:.06em;margin-bottom:6px}.field input{width:100%;height:clamp(38px,4vw,46px);border:1px solid #2b2b2f;border-radius:9px;outline:0;background:#060607;padding:0 12px;font-size:clamp(9px,1vw,12px);transition:.15s}.field input::placeholder{color:#555}.field input:focus{border-color:#a21b22;box-shadow:0 0 0 3px #ff202814}.error{display:none;color:#ff5b61;font-size:clamp(7px,.85vw,10px);margin-top:6px}.error.show{display:block}.foot{display:flex;justify-content:flex-end;gap:7px;padding:clamp(10px,1.2vw,14px) clamp(14px,1.8vw,20px);border-top:1px solid var(--border2);background:#080809}.foot button{height:clamp(32px,3.2vw,38px);border-radius:8px;padding:0 clamp(12px,1.4vw,16px);font-size:clamp(8px,.95vw,11px);font-weight:750}.cancel{border:1px solid #29292d;background:#111;color:#aaa}.cancel:hover{background:#151516;color:#fff}.create-btn{border:1px solid #ff4148;background:linear-gradient(180deg,#ff3038,#d9141b);box-shadow:0 5px 16px rgba(255,32,40,.14)}.create-btn:hover{filter:brightness(1.08)}
@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}.project-bar{min-height:45px}.empty{min-height:70px}}
@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.primary{padding:7px 10px;font-size:8px}.project-bar{min-height:45px;padding:7px;gap:7px}.project-icon{width:28px;height:28px;font-size:12px}.project-info strong{font-size:9px}.project-info small{font-size:7px}.more{width:28px;height:28px}.empty{min-height:65px}.modal{width:min(400px,90vw)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a class="active" href="projects.html"><span class="ico">□</span>Projects</a><a href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside>
<main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Open settings"><span class="gear">⚙</span></a></header>
<section class="content"><div class="heading"><div><h1><span>Projects</span></h1><p>Manage your Axilort Engine projects.</p></div><button class="primary" id="newProject" type="button">＋ New Project</button></div><div id="projectArea"></div></section></main></div>
<div class="backdrop" id="createModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="createTitle"><div class="modal-head"><div class="modal-title"><div class="modal-symbol">＋</div><h2 id="createTitle">Create New Project</h2></div><p>Start a new Axilort Engine project in your app storage.</p></div><div class="modal-body"><div class="field"><label for="projectName">PROJECT NAME</label><input id="projectName" maxlength="80" placeholder="My Axilort Project" autocomplete="off" spellcheck="false"><div class="error" id="nameError"></div></div></div><div class="foot"><button class="cancel" id="cancelCreate" type="button">Cancel</button><button class="create-btn" id="createProject" type="button">Create Project</button></div></div></div>
<script>
(()=>{
const area=document.getElementById('projectArea'),newBtn=document.getElementById('newProject'),modal=document.getElementById('createModal'),input=document.getElementById('projectName'),error=document.getElementById('nameError');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const native=()=>typeof window.AxilortStorage!=='undefined';
const valid=n=>{n=String(n||'').trim();return n&&n!=='.'&&n!=='..'&&!n.includes('/')&&!n.includes('\\')};
const list=()=>{try{return JSON.parse(AxilortStorage.list('projects')||'[]').filter(x=>x.folder).sort((a,b)=>a.name.localeCompare(b.name))}catch(e){return[]}};
function render(){if(!native()){area.innerHTML='<div class="empty"><div class="empty-icon">!</div><strong>Native storage unavailable</strong><span>Open this page inside the Axilort Engine APK.</span></div>';return}const items=list();area.innerHTML='';if(!items.length){area.innerHTML='<div class="empty"><div class="empty-icon">□</div><strong>No projects yet</strong><span>Create your first project to see it here.</span></div>';return}const wrap=document.createElement('div');wrap.className='project-list';items.forEach(x=>{const d=document.createElement('div');d.className='project-bar';d.innerHTML='<div class="project-icon">□</div><div class="project-info"><strong>'+esc(x.name)+'</strong><small>axilort-engine-data / projects / '+esc(x.name)+'</small></div><button class="more" type="button" aria-label="Project menu">⋮</button><div class="menu"><button data-a="open">Open Assets</button><button data-a="rename">Rename</button><button class="danger" data-a="delete">Delete</button></div>';const m=d.querySelector('.menu'),more=d.querySelector('.more');more.onclick=e=>{e.stopPropagation();document.querySelectorAll('.menu.show').forEach(z=>z.classList.remove('show'));m.classList.add('show');more.classList.add('open')};d.querySelector('[data-a=open]').onclick=()=>location.href='assets.html?project='+encodeURIComponent(x.name);d.querySelector('[data-a=rename]').onclick=()=>renameProject(x);d.querySelector('[data-a=delete]').onclick=()=>{if(confirm('Delete '+x.name+' and all its files?')&&AxilortStorage.delete('projects/'+x.name))render()};wrap.appendChild(d)});area.appendChild(wrap)}
function showModal(){error.textContent='';error.classList.remove('show');input.value='';modal.classList.add('show');setTimeout(()=>input.focus(),60)}
function hideModal(){modal.classList.remove('show');input.value='';error.classList.remove('show')}
function create(){const n=input.value.trim();if(!valid(n)){error.textContent='Enter a valid project name without / or \\.';error.classList.add('show');input.focus();return}if(!native()){error.textContent='Native storage is unavailable.';error.classList.add('show');return}if(!AxilortStorage.createProject(n)){error.textContent='Could not create project. The name may already exist.';error.classList.add('show');return}hideModal();render()}
function renameProject(x){let n=prompt('New project name',x.name);if(n===null)return;n=n.trim();if(!valid(n)){alert('Invalid project name.');return}if(n===x.name)return;if(AxilortStorage.rename('projects/'+x.name,'projects/'+n))render();else alert('Could not rename project. The name may already exist.')}
newBtn.onclick=showModal;document.getElementById('cancelCreate').onclick=hideModal;document.getElementById('createProject').onclick=create;input.addEventListener('keydown',e=>{if(e.key==='Enter')create();if(e.key==='Escape')hideModal()});modal.addEventListener('click',e=>{if(e.target===modal)hideModal()});document.addEventListener('click',()=>document.querySelectorAll('.menu.show').forEach(z=>z.classList.remove('show')));render();
})();
</script>
</body></html>
