<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505"><title>Projects — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}.app{position:fixed;inset:0;display:flex;background:#050505}.sidebar{width:clamp(94px,15vw,205px);flex:none;border-right:1px solid #18181a;background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column}.brand{text-align:center;padding-bottom:clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain}.nav{display:flex;flex-direction:column;gap:4px}.nav a{height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:9px;padding:0 10px;border:1px solid transparent;border-radius:10px;color:#ccc;text-decoration:none;font-weight:600;font-size:clamp(8px,1.05vw,14px)}.nav a.active{background:linear-gradient(90deg,#ff202826,#ff20280d);border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 #ff2028}.ico{width:20px;text-align:center}.active .ico{color:#ff2028}.version{margin-top:auto;color:#666;font-size:10px;text-align:center}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 2vw}.top-action{font-size:24px;text-decoration:none;padding:8px}.content{padding:clamp(10px,1.7vw,25px) clamp(12px,2vw,28px);overflow:auto}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:17px}.heading h1{margin:0;font-size:clamp(17px,2.55vw,27px);font-weight:800}.heading h1 span{color:#ff2028}.heading p{margin:4px 0 0;color:#929297;font-size:clamp(8px,1.05vw,13px)}.primary{border:1px solid #ff3b42;background:linear-gradient(#ff3038,#d9151c);border-radius:7px;padding:9px 15px;font-weight:750;font-size:12px}.project-list{display:flex;flex-direction:column;gap:10px}.project-bar{position:relative;min-height:62px;display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #242426;border-radius:12px;background:linear-gradient(145deg,#0c0c0d,#080809)}.project-icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:9px;color:#ff2028}.project-info{min-width:0;flex:1}.project-info strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-info small{display:block;margin-top:4px;color:#777;font-size:10px}.more{width:34px;height:34px;border:0;border-radius:8px;background:transparent;font-size:21px}.empty{min-height:115px;border:1px dashed #29292b;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center}.empty-icon{width:40px;height:40px;border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:6px}.empty strong{font-size:12px}.empty span{font-size:10px;color:#777;margin-top:3px}.menu{position:absolute;right:8px;top:calc(100% + 5px);z-index:5;min-width:150px;padding:4px;border:1px solid #242426;border-radius:9px;background:#0b0b0c;display:none;box-shadow:0 18px 50px #000d}.menu.show{display:block}.menu button{width:100%;height:32px;border:0;border-radius:6px;background:transparent;text-align:left;padding:0 10px;font-size:11px}.menu button:hover{background:#151516}.danger{color:#ff5960}
@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.primary{padding:7px 10px;font-size:8px}.project-bar{min-height:45px;padding:7px}.project-icon{width:28px;height:28px}.project-info strong{font-size:9px}.project-info small{font-size:7px}}
</style></head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a class="active" href="projects.html"><span class="ico">□</span>Projects</a><a href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html">⚙</a></header><section class="content"><div class="heading"><div><h1><span>Projects</span></h1><p>Projects are stored in the Axilort Engine app storage.</p></div><button class="primary" id="newProject">＋ New Project</button></div><div id="projectArea"></div></section></main></div>
<script>
(()=>{
 const area=document.getElementById('projectArea'),btn=document.getElementById('newProject');
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function native(){return typeof window.AxilortStorage!=='undefined'}
 function list(){try{return JSON.parse(AxilortStorage.list('projects')||'[]').filter(x=>x.folder)}catch(e){return[]}}
 function render(){if(!native()){area.innerHTML='<div class="empty"><div class="empty-icon">!</div><strong>Native storage unavailable</strong><span>Open this page inside the Axilort Engine APK.</span></div>';return}const items=list();area.innerHTML='';if(!items.length){area.innerHTML='<div class="empty"><div class="empty-icon">□</div><strong>No projects yet</strong><span>Create your first project to see it here.</span></div>';return}const wrap=document.createElement('div');wrap.className='project-list';items.forEach(x=>{const d=document.createElement('div');d.className='project-bar';d.innerHTML='<div class="project-icon">□</div><div class="project-info"><strong>'+esc(x.name)+'</strong><small>axilort-engine-data / projects / '+esc(x.name)+'</small></div><button class="more" type="button">⋮</button><div class="menu"><button data-a="open">Open Assets</button><button data-a="rename">Rename</button><button class="danger" data-a="delete">Delete</button></div>';const m=d.querySelector('.menu');d.querySelector('.more').onclick=e=>{e.stopPropagation();document.querySelectorAll('.menu.show').forEach(z=>z.classList.remove('show'));m.classList.add('show')};d.querySelector('[data-a=open]').onclick=()=>location.href='assets.html?project='+encodeURIComponent(x.name);d.querySelector('[data-a=rename]').onclick=()=>{let n=prompt('New project name',x.name);if(!n)return;n=n.trim();if(!n||n.includes('/')||n.includes('\\'))return alert('Invalid project name');if(AxilortStorage.rename('projects/'+x.name,'projects/'+n))render();else alert('Could not rename project')};d.querySelector('[data-a=delete]').onclick=()=>{if(confirm('Delete '+x.name+' and all its files?')){if(AxilortStorage.delete('projects/'+x.name))render();else alert('Could not delete project')}};wrap.appendChild(d)});area.appendChild(wrap)}
 btn.onclick=()=>{if(!native())return alert('Native storage is unavailable.');let n=prompt('Project name');if(!n)return;n=n.trim();if(!n||n.includes('/')||n.includes('\\'))return alert('Invalid project name');if(AxilortStorage.createProject(n))render();else alert('Could not create project. The name may already exist.')};
 document.addEventListener('click',()=>document.querySelectorAll('.menu.show').forEach(z=>z.classList.remove('show')));render();
})();
</script></body></html>
