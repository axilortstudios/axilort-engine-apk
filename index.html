<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Axilort Engine</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#viewer{position:fixed;inset:0;width:100%;height:100%;background:#000}#website{width:100%;height:100%;border:0;display:block;background:#000}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}.bar{width:42px;height:3px;background:#141414;border-radius:9px;overflow:hidden}.bar:after{content:"";display:block;width:100%;height:100%;background:#e50914;animation:load .35s linear forwards}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(0)}}@media(orientation:portrait){#viewer{width:100vh;height:100vw;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}</style></head><body><section id="viewer"><iframe id="website" src="home.html" allow="fullscreen; autoplay; clipboard-read; clipboard-write; camera; microphone; geolocation" allowfullscreen></iframe><div id="loading"><div class="bar"></div></div></section><script>const website=document.getElementById('website'),loading=document.getElementById('loading');website.addEventListener('load',()=>loading.style.display='none');try{if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}</script></body></html>
