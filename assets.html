<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>Axilort Assets</title><style>:root{--bg:#050505;--panel:#0b0b0c;--line:#252527;--text:#f2f2f3;--muted:#88888e;--red:#ff2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:flex}.side{width:150px;flex:none;border-right:1px solid #18181a;padding:15px 10px;background:#070708}.brand{text-align:center;padding:4px 0 22px}.brand img{width:58px;height:58px;object-fit:contain}.nav a{display:block;text-decoration:none;color:#aaa;padding:11px 10px;border-radius:9px;font-size:12px;margin:3px 0}.nav a:hover,.nav .active{background:#151011;color:#fff}.nav .active{box-shadow:inset 2px 0 #ff2028}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;justify-content:flex-end;padding:0 22px}.content{padding:10px 25px 25px;overflow:auto}.title h1{margin:0;font-size:27px}.title h1 span{color:var(--red)}.title p{margin:4px 0 17px;color:var(--muted);font-size:12px}.panel{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#0d0d0e,#080809);overflow:hidden}.head{min-height:58px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #19191b}.head h2{font-size:15px;margin:0}.path{flex:1;color:#777;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:6px}.btn{height:35px;border:1px solid #303034;background:#111;border-radius:8px;padding:0 12px;font-size:11px}.primary{border-color:#ff4148;background:linear-gradient(#ff3038,#d9151c)}.search{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid #19191b}.search input{flex:1;min-width:0;height:35px;border:1px solid #29292d;border-radius:8px;background:#09090a;padding:0 10px;outline:0}.list{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.item{position:relative;min-height:67px;border:1px solid var(--line);border-radius:11px;background:#0b0b0c;display:flex;align-items:center;gap:10px;padding:9px}.item:hover{border-color:#8e161b}.icon{width:42px;height:42px;flex:none;border:1px solid #29292d;border-radius:10px;display:grid;place-items:center;color:var(--red);font-size:9px;font-weight:800}.info{min-width:0;flex:1}.info b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;margin-top:4px;color:#68686e;font-size:9px}.more{width:30px;height:32px;border:0;background:transparent;border-radius:7px}.more:hover{background:#171718}.menu{position:absolute;right:8px;top:45px;z-index:5;width:145px;padding:4px;border:1px solid #303034;border-radius:9px;background:#0b0b0c;box-shadow:0 20px 50px #000;display:none}.menu.show{display:block}.menu button{display:block;width:100%;height:32px;border:0;background:transparent;text-align:left;padding:0 9px;font-size:10px;border-radius:5px}.menu button:hover{background:#171718}.empty{grid-column:1/-1;text-align:center;padding:55px 15px;color:#777}.empty b{display:block;color:#ddd;margin-bottom:5px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#111;border:1px solid #333;border-radius:9px;padding:10px 14px;font-size:10px;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.side{width:100px}.nav a{font-size:9px;padding:9px 7px}.brand img{width:38px;height:38px}.content{padding:8px}.top{height:42px}.title h1{font-size:19px}.title p{font-size:8px}.head{min-height:45px;padding:7px}.head h2{font-size:10px}.path{font-size:8px}.btn{height:29px;font-size:8px;padding:0 8px}.search{padding:7px}.search input{height:29px;font-size:8px}.list{padding:7px;grid-template-columns:1fr}.item{min-height:54px}.icon{width:35px;height:35px}.info b{font-size:10px}.info small{font-size:8px}}</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="images/logo.png"></div><nav class="nav"><a href="home.html">⌂ Home</a><a href="projects.html">□ Projects</a><a class="active" href="assets.html">◇ Assets</a><a href="settings.html">⚙ Settings</a><a href="team.html">♙ Team</a></nav></aside><main class="main"><header class="top">⚙</header><div class="content"><div class="title"><h1>Axilort <span>Assets</span></h1><p>File manager for axilort-engine-data/projects/.</p></div><section class="panel"><div class="head"><h2 id="heading">Projects</h2><div class="path" id="path">axilort-engine-data/projects/</div><div class="actions"><button class="btn" onclick="up()">↑ Up</button><button class="btn" onclick="newFolder()">＋ Folder</button><button class="primary btn" onclick="upload()">＋ Upload</button></div></div><div class="search"><input id="q" placeholder="Search files and folders…" oninput="render()"></div><div id="list" class="list"></div></section></div></main></div><input id="file" type="file" multiple style="display:none"><div id="toast" class="toast"></div><script>
const ROOT='projects';let cwd=ROOT,items=[];const native=typeof AxilortStorage!=='undefined';
const toast=s=>{let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
const clean=p=>String(p||'').replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const js=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function getList(){if(native){try{return JSON.parse(AxilortStorage.list(cwd))}catch(e){return[]}}return JSON.parse(localStorage.getItem('axilort-web:'+cwd)||'[]')}
function refresh(){items=getList();document.getElementById('path').textContent='axilort-engine-data/'+cwd+'/';render()}
function render(){let q=document.getElementById('q').value.toLowerCase(),a=items.filter(x=>x.name.toLowerCase().includes(q));let l=document.getElementById('list');l.innerHTML='';if(!a.length){l.innerHTML='<div class="empty"><b>Folder is empty</b><span>Create a folder, project, or upload files.</span></div>';return}a.forEach(x=>{let d=document.createElement('div');d.className='item';let p=clean(x.path);d.innerHTML='<div class="icon">'+(x.folder?'DIR':'FILE')+'</div><div class="info"><b>'+esc(x.name)+'</b><small>'+(x.folder?'Folder':size(x.size))+'</small></div><button class="more">⋮</button><div class="menu"><button data-a="rename">Rename</button><button data-a="open">'+(x.folder?'Open':'Read')+'</button><button data-a="download">Download</button><button data-a="delete">Delete</button></div>';d.querySelector('.more').onclick=e=>{e.stopPropagation();document.querySelectorAll('.menu.show').forEach(m=>m.classList.remove('show'));d.querySelector('.menu').classList.toggle('show')};d.querySelectorAll('.menu button').forEach(b=>b.onclick=e=>{e.stopPropagation();let a=b.dataset.a;if(a==='rename')renameItem(p);if(a==='open')openItem(p,x.folder);if(a==='download')downloadItem(p,x.folder);if(a==='delete')deleteItem(p)});d.onclick=e=>{if(e.target.closest('.menu')||e.target.closest('.more'))return;if(x.folder){cwd=p;refresh()}};l.appendChild(d)})}
function size(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
function up(){if(cwd===ROOT)return;cwd=cwd.split('/').slice(0,-1).join('/')||ROOT;refresh()}
function newFolder(){let n=prompt('Folder name');if(!n)return;let p=clean(cwd+'/'+n);if(native?AxilortStorage.mkdir(p):localMkdir(p)){toast('Folder created');refresh()}else toast('Could not create folder')}
function localMkdir(p){localStorage.setItem('axilort-web:'+p,'[]');return true}
function upload(){document.getElementById('file').click()}
document.getElementById('file').onchange=async e=>{for(const f of e.target.files){let b=await new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});let p=clean(cwd+'/'+f.name);if(native)AxilortStorage.writeBase64(p,b);else localStorage.setItem('axilort-file:'+p,b)}e.target.value='';toast('Upload complete');refresh()}
function renameItem(p){let n=prompt('New name',p.split('/').pop());if(!n)return;let to=p.split('/').slice(0,-1).concat(n).join('/');if(native&&AxilortStorage.rename(p,to)){toast('Renamed');refresh()}else toast('Rename requires native storage')}
function deleteItem(p){if(!confirm('Delete '+p+'?'))return;if(native&&AxilortStorage.delete(p)){toast('Deleted');refresh()}else toast('Delete failed')}
function openItem(p,folder){if(folder){cwd=p;refresh();return}if(!native){toast('Open is available in the APK');return}let b=AxilortStorage.readBase64(p);if(!b){toast('Unable to read file');return}let raw=atob(b),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);let text;try{text=new TextDecoder().decode(bytes)}catch(e){text=raw}let w=window.open('','_blank');if(w){w.document.body.style='background:#050505;color:#eee;font-family:monospace;padding:20px';w.document.body.innerText=text}}
function downloadItem(p,folder){if(folder){toast('Folders cannot be downloaded directly');return}if(!native){toast('Download is available in the APK');return}let b=AxilortStorage.readBase64(p);if(!b)return;let raw=atob(b),u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u]));a.download=p.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
refresh();
</script></body></html>
