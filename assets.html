<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Axilort Assets</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}
@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}
.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain;flex:none}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap;text-decoration:none}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#ededee}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.welcome{margin-bottom:clamp(7px,1.15vw,17px)}.welcome h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.welcome h1 span{color:var(--red)}.welcome p{margin:3px 0 0;color:#929297;font-size:clamp(7px,1.05vw,13px)}
.panel{border:1px solid var(--border);border-radius:clamp(9px,1.5vw,17px);background:linear-gradient(145deg,#0c0c0d,#080809);overflow:hidden}.panel-head{min-height:clamp(45px,5vw,60px);padding:clamp(7px,1vw,12px) clamp(9px,1.3vw,16px);border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:clamp(6px,1vw,12px)}.panel-head h2{font-size:clamp(9px,1.4vw,16px);margin:0;white-space:nowrap}.path{flex:1;color:#777;font-size:clamp(7px,1vw,11px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:6px;flex:none}.btn{border:1px solid #303034;background:#111;border-radius:7px;height:clamp(29px,3.2vw,36px);padding:0 clamp(7px,1vw,12px);font-size:clamp(7px,1vw,11px);font-weight:650;white-space:nowrap}.btn:hover{background:#171718}.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);box-shadow:0 6px 18px rgba(255,32,40,.16)}.search{display:flex;gap:7px;padding:clamp(7px,1vw,10px) clamp(9px,1.3vw,14px);border-bottom:1px solid var(--border2)}.search input{flex:1;min-width:0;height:clamp(29px,3.2vw,35px);border:1px solid #29292d;border-radius:8px;background:#09090a;padding:0 10px;outline:0;font-size:clamp(8px,1vw,11px)}.search input:focus{border-color:#8e161b;box-shadow:0 0 0 3px #ff202814}.list{padding:clamp(7px,1vw,12px);display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.item{position:relative;min-height:clamp(55px,6vw,67px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,11px);background:linear-gradient(145deg,#0c0c0d,#080809);display:flex;align-items:center;gap:10px;padding:9px}.item:hover{border-color:#8e161b}.icon{width:clamp(34px,3.5vw,42px);height:clamp(34px,3.5vw,42px);flex:none;border:1px solid #29292d;border-radius:10px;display:grid;place-items:center;color:var(--red);font-size:9px;font-weight:800}.info{min-width:0;flex:1}.info b{display:block;font-size:clamp(9px,1.15vw,12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;margin-top:4px;color:#68686e;font-size:clamp(7px,.9vw,9px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:30px;height:32px;border:0;background:transparent;border-radius:7px;font-size:18px}.more:hover{background:#171718}.menu{position:absolute;right:8px;top:45px;z-index:20;width:150px;padding:4px;border:1px solid #303034;border-radius:9px;background:#0b0b0c;box-shadow:0 20px 50px #000;display:none}.menu.show{display:block}.menu button{display:block;width:100%;height:32px;border:0;background:transparent;text-align:left;padding:0 9px;font-size:10px;border-radius:5px}.menu button:hover{background:#171718}.menu .danger{color:#ff5960}.empty{grid-column:1/-1;min-height:clamp(90px,12vw,150px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;color:#777}.empty-icon{width:clamp(28px,3.2vw,40px);height:clamp(28px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px}.empty strong{font-size:clamp(8px,1.05vw,12px);color:#ddd}.empty span{font-size:clamp(7px,.85vw,10px);margin-top:2px}.backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:12px;background:#000c;backdrop-filter:blur(7px)}.backdrop.show{display:flex}.modal{width:min(620px,94vw);max-height:90vh;border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,#0c0c0d,#080809);box-shadow:0 30px 100px #000;overflow:hidden;display:flex;flex-direction:column}.modal-head{padding:15px 17px;border-bottom:1px solid var(--border2)}.modal-head h2{margin:0;font-size:clamp(13px,1.5vw,17px)}.modal-head p{margin:4px 0 0;color:#777;font-size:clamp(8px,1vw,11px)}.modal-body{padding:15px 17px;overflow:auto}.field label{display:block;color:#aaa;font-size:10px;font-weight:750;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #2b2b2f;border-radius:7px;outline:0;background:#070708;padding:10px;font-size:11px}.field input{height:40px}.field textarea{min-height:280px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.5}.field input:focus,.field textarea:focus{border-color:#8e161b;box-shadow:0 0 0 3px #ff202814}.error{display:none;color:#ff5b61;font-size:9px;margin-top:5px}.error.show{display:block}.foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 17px;border-top:1px solid var(--border2);background:#080809}.foot button{height:34px;border-radius:7px;padding:0 13px;font-size:10px;font-weight:750}.cancel{border:1px solid #29292d;background:#111;color:#aaa}.danger-btn{border:1px solid #ff4148;background:linear-gradient(#ff3038,#d9141b)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#111;border:1px solid #333;border-radius:9px;padding:10px 14px;font-size:10px;transition:.2s;z-index:80;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}.item{min-height:45px}.modal{max-height:88vh}}
@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.welcome{margin-bottom:7px}.welcome h1{font-size:17px}.welcome p{font-size:8px}.panel-head{min-height:38px;padding:6px}.panel-head h2{font-size:9px}.path{font-size:7px}.btn{height:27px;font-size:7px;padding:0 7px}.search{padding:6px}.search input{height:27px;font-size:8px}.list{padding:6px;grid-template-columns:1fr}.item{min-height:48px;padding:7px}.icon{width:32px;height:32px}.info b{font-size:9px}.info small{font-size:7px}.modal{width:min(410px,90vw)}}
</style>
<style>
/* Professional floating three-dot menu: never clipped by cards, grids, or panels. */
.menu.ax-floating-menu{position:fixed!important;right:auto!important;top:auto!important;z-index:2147483647!important;width:168px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain;padding:5px;border:1px solid #38383d;border-radius:10px;background:rgba(11,11,12,.98);box-shadow:0 18px 55px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.025);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transform-origin:top right}
.menu.ax-floating-menu button{height:34px;padding:0 10px;border-radius:6px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu.ax-floating-menu button:active{background:#202024}
.menu.ax-floating-menu.menu-above{transform-origin:bottom right}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div>
<nav class="nav" aria-label="Engine navigation">
<a href="home.html"><span class="ico">⌂</span>Home</a>
<a href="projects.html"><span class="ico">□</span>Projects</a>
<a class="active" href="assets.html"><span class="ico">◇</span>Assets</a>
<a href="settings.html"><span class="ico">⚙</span>Settings</a>
<a href="team.html"><span class="ico">♙</span>Team</a>
</nav>
<div class="version">Axilort Engine v1.0.0</div>
</aside>
<main class="main">
<header class="topbar"><a class="top-action" href="settings.html" aria-label="Open settings"><span class="gear">⚙</span></a></header>
<div class="content">
<div class="welcome"><h1>Axilort <span>Assets</span></h1><p>Manage your Axilort Engine project files.</p></div>
<section class="panel">
<div class="panel-head"><h2 id="heading">Projects</h2><div class="path" id="path">axilort-engine-data/projects/</div><div class="actions"><button class="btn" onclick="up()">↑ Up</button><button class="btn" onclick="newFolder()">＋ Folder</button><button class="btn" onclick="newFile()">＋ File</button><button class="primary btn" onclick="upload()">＋ Upload</button></div></div>
<div class="search"><input id="q" placeholder="Search files and folders…" oninput="render()"></div>
<div id="list" class="list"></div>
</section>
</div>
</main>
</div>
<input id="file" type="file" multiple style="display:none">
<div id="toast" class="toast"></div>
<div class="backdrop" id="editorModal"><div class="modal"><div class="modal-head"><h2 id="editorTitle">Edit file</h2><p id="editorPath"></p></div><div class="modal-body"><div class="field"><textarea id="editorText" spellcheck="false"></textarea><div class="error" id="editorError"></div></div></div><div class="foot"><button class="cancel" onclick="closeEditor()">Cancel</button><button class="danger-btn" onclick="saveEditor()">Save File</button></div></div></div>
<script>
const ROOT='projects';
let cwd=ROOT,items=[],editingPath='';
const native=typeof AxilortStorage!=='undefined';
const $=id=>document.getElementById(id);
const toast=s=>{const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1800)};
const clean=p=>String(p||'').replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeName=n=>{n=String(n||'').trim();return !!n&&!n.includes('/')&&!n.includes('\\')&&n!=='.'&&n!=='..'};
const canModify=()=>cwd!==ROOT;
function getList(){if(native){try{return JSON.parse(AxilortStorage.list(cwd)||'[]')}catch(e){return[]}}return JSON.parse(localStorage.getItem('axilort-web:'+cwd)||'[]')}
function refresh(){items=getList().sort((a,b)=>Number(b.folder)-Number(a.folder)||a.name.localeCompare(b.name));$('path').textContent='axilort-engine-data/'+cwd+'/';$('heading').textContent=cwd===ROOT?'Projects':cwd.split('/').pop();render()}
function render(){const q=$('q').value.trim().toLowerCase();const a=items.filter(x=>x.name.toLowerCase().includes(q));const l=$('list');l.innerHTML='';if(!a.length){l.innerHTML='<div class="empty"><div class="empty-icon">□</div><strong>'+(q?'No matching files':'Folder is empty')+'</strong><span>'+(q?'Try another search.':'Create a folder, file, or upload assets.')+'</span></div>';return}a.forEach(x=>{const d=document.createElement('div');d.className='item';const p=clean(x.path);d.innerHTML='<div class="icon">'+(x.folder?'DIR':'FILE')+'</div><div class="info"><b>'+esc(x.name)+'</b><small>'+(x.folder?'Folder':size(x.size))+'</small></div><button class="more" aria-label="More">⋮</button><div class="menu"><button data-a="open">'+(x.folder?'Open':'Read / Edit')+'</button><button data-a="rename">Rename</button><button data-a="download">Download</button><button class="danger" data-a="delete">Delete</button></div>';
d.querySelector('.more').onclick=e=>{e.stopPropagation();document.querySelectorAll('.menu.show').forEach(m=>m.classList.remove('show'));d.querySelector('.menu').classList.toggle('show')};
d.querySelectorAll('.menu button').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.a;if(a==='open')openItem(p,x.folder);else if(a==='rename')renameItem(p);else if(a==='download')downloadItem(p,x.folder);else if(a==='delete')deleteItem(p)});
d.onclick=e=>{if(e.target.closest('.menu')||e.target.closest('.more'))return;if(x.folder){cwd=p;refresh()}};l.appendChild(d)})}
function size(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(1)+' GB'}
function up(){if(cwd===ROOT)return;cwd=cwd.split('/').slice(0,-1).join('/')||ROOT;refresh()}
function newFolder(){if(!canModify()){toast('Project root is read-only');return}const n=prompt('Folder name');if(!safeName(n)){if(n)toast('Invalid folder name');return}const p=clean(cwd+'/'+n);const ok=native?AxilortStorage.mkdir(p):localMkdir(p);toast(ok?'Folder created':'Could not create folder');if(ok)refresh()}
function newFile(){if(!canModify()){toast('Project root is read-only');return}const n=prompt('File name','new-file.txt');if(!safeName(n)){if(n)toast('Invalid file name');return}const p=clean(cwd+'/'+n);const ok=native?AxilortStorage.writeText(p,''):localWrite(p,'');toast(ok?'File created':'Could not create file');if(ok){refresh();setTimeout(()=>openItem(p,false),100)}}
function localMkdir(p){localStorage.setItem('axilort-web:'+p,'[]');return true}
function localWrite(p,t){localStorage.setItem('axilort-file:'+p,btoa(unescape(encodeURIComponent(t))));return true}
function upload(){if(!canModify()){toast('Project root is read-only');return}$('file').click()}
$('file').onchange=async e=>{if(!canModify()){e.target.value='';toast('Project root is read-only');return}for(const f of e.target.files){const b=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});const p=clean(cwd+'/'+f.name);if(native)AxilortStorage.writeBase64(p,b);else localStorage.setItem('axilort-file:'+p,b)}e.target.value='';toast('Upload complete');refresh()}
function renameItem(p){if(!canModify()){toast('Project root is read-only');return}const old=p.split('/').pop();const n=prompt('New name',old);if(!safeName(n)||n===old)return;const to=p.split('/').slice(0,-1).concat(n).join('/');const ok=native?AxilortStorage.rename(p,to):false;toast(ok?'Renamed':'Rename failed');if(ok)refresh()}
function deleteItem(p){if(!canModify()){toast('Project root is read-only');return}if(!confirm('Delete '+p+'?'))return;const ok=native?AxilortStorage.delete(p):false;toast(ok?'Deleted':'Delete failed');if(ok)refresh()}
function openItem(p,folder){if(folder){cwd=p;refresh();return}if(!canModify()){toast('Project root is read-only');return}if(!native){toast('File editing is available in the APK');return}const b=AxilortStorage.readBase64(p);if(!b){toast('Unable to read file');return}let raw=atob(b),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);let text;try{text=new TextDecoder().decode(bytes)}catch(e){text=raw}editingPath=p;$('editorTitle').textContent='Edit '+p.split('/').pop();$('editorPath').textContent='axilort-engine-data/'+p;$('editorText').value=text;$('editorError').classList.remove('show');$('editorModal').classList.add('show')}
function closeEditor(){editingPath='';$('editorModal').classList.remove('show')}
function saveEditor(){if(!editingPath)return;if(!canModify()){toast('Project root is read-only');return}const ok=AxilortStorage.writeText(editingPath,$('editorText').value);if(!ok){$('editorError').textContent='Could not save this file.';$('editorError').classList.add('show');return}toast('File saved');closeEditor();refresh()}
function downloadItem(p,folder){if(folder){toast('Folders cannot be downloaded directly');return}if(!native){toast('Download is available in the APK');return}const b=AxilortStorage.readBase64(p);if(!b){toast('Unable to read file');return}const raw=atob(b),u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u]));a.download=p.split('/').pop();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('click',()=>document.querySelectorAll('.menu.show').forEach(m=>m.classList.remove('show')));
const project=new URLSearchParams(location.search).get('project');
if(project&&safeName(project)){cwd=ROOT+'/'+project;}
refresh();
</script>
<script>
/* Robust floating menu controller. It works in the normal browser and inside the Android WebView. */
(()=>{
  let active=null,anchor=null,raf=0;
  const all=()=>document.querySelectorAll('.menu.ax-floating-menu');
  const close=()=>{if(!active)return;active.classList.remove('show','ax-floating-menu','menu-above');active.style.removeProperty('left');active.style.removeProperty('top');active.style.removeProperty('visibility');active=null;anchor=null};
  const position=()=>{
    if(!active||!anchor||!active.classList.contains('show'))return;
    const r=anchor.getBoundingClientRect(),m=active.getBoundingClientRect(),gap=6,pad=8,vw=window.innerWidth,vh=window.innerHeight;
    let left=r.right-m.width;
    if(left<pad)left=pad;
    if(left+m.width>vw-pad)left=Math.max(pad,vw-pad-m.width);
    const below=r.bottom+gap,above=r.top-m.height-gap;
    let top=below,aboveMode=false;
    if(below+m.height>vh-pad&&above>=pad){top=above;aboveMode=true}
    if(top<pad)top=pad;
    if(top+m.height>vh-pad)top=Math.max(pad,vh-pad-m.height);
    active.classList.toggle('menu-above',aboveMode);
    active.style.left=Math.round(left)+'px';
    active.style.top=Math.round(top)+'px';
  };
  const open=(button,menu)=>{
    if(active===menu){close();return}
    close();
    anchor=button;active=menu;
    active.classList.add('show','ax-floating-menu');
    active.style.visibility='hidden';
    requestAnimationFrame(()=>{position();active.style.visibility='visible';});
  };
  const bind=root=>{
    root.querySelectorAll('.more').forEach(button=>{
      if(button.dataset.axMenuBound==='1')return;
      const menu=button.parentElement.querySelector('.menu');
      if(!menu)return;
      button.dataset.axMenuBound='1';
      button.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();open(button,menu)},true);
    });
  };
  bind(document);
  new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(n=>{if(n.nodeType===1)bind(n)}))).observe(document.getElementById('list')||document.body,{childList:true,subtree:true});
  document.addEventListener('pointerdown',e=>{if(active&&!e.target.closest('.menu.ax-floating-menu')&&!e.target.closest('.more'))close()},{capture:true});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  const reposition=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(position)};
  window.addEventListener('resize',reposition,{passive:true});
  document.querySelector('.content')?.addEventListener('scroll',reposition,{passive:true});
})();
</script>
</body>
</html>
